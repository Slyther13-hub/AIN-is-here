<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#061a3a">
<title>AIN is here — All I Need</title>
<style>
*{box-sizing:border-box}
:root{
 --navy:#071b3a;--navy2:#0b2c5c;--blue:#0878f9;--blue2:#1c5eea;
 --purple:#743bd5;--purple2:#8a49e8;--green:#18c875;--gold:#f2b51d;
 --bg:#f4f8fc;--card:#fff;--line:#d5e2ef;--muted:#6d7f99;--text:#122b55
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.header{height:66px;background:linear-gradient(90deg,#061a3a,#0c2d60);display:flex;align-items:center;padding:0 18px;color:#fff;box-shadow:0 2px 10px #00102b55;position:sticky;top:0;z-index:50}
.brand{border:0;background:none;color:#fff;font-size:21px;font-weight:800;padding:0;position:relative}
.brand .ain{font-size:29px;letter-spacing:-3px}.a{color:#159eff}.i{color:#ffb514}.n{color:#29c95b}
.brand .tag{display:block;font-size:8px;letter-spacing:.5px;margin-top:-3px;color:#dbe7f7;text-align:center}
.tooltip{position:absolute;left:42px;top:39px;background:#182b4c;padding:6px 10px;border-radius:5px;font-size:11px;font-weight:400;white-space:nowrap;display:none;box-shadow:0 4px 10px #0005}
.brand:hover .tooltip{display:block}
.nav{margin-left:auto;display:flex;gap:18px;align-items:center}.nav button{border:0;background:none;color:#dce6f4;font-size:12px}.nav button:hover{color:#fff}
.loginBtn{background:var(--blue)!important;color:#fff!important;border-radius:7px;padding:10px 18px!important;font-weight:700}
.menu{display:none;margin-left:auto;background:none;border:0;color:#fff;font-size:25px}
#app{min-height:calc(100vh - 66px)}.page{min-height:calc(100vh - 66px);padding:18px;background:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 14px #173e6a12}
.back{border:0;background:none;color:#17345f;font-weight:700;font-size:12px;padding:5px 0}
.btn{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:11px 16px;font-weight:700;box-shadow:0 3px 8px #0878f92e}
.btn.full{width:100%}.btn.green{background:var(--green)}.btn.purple{background:var(--purple)}.btn.white{background:#fff;color:var(--blue)}
.title{max-width:850px;margin:8px auto 18px}.title h2{font-size:21px;margin:0}.title p{font-size:11px;color:var(--muted);margin:5px 0}
.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:9px;font-weight:800}.badge.blue{background:#e6f1ff;color:#0767d8}.badge.purple{background:#f0e9ff;color:#6931be}.badge.green{background:#e2fff1;color:#087a49}
.home{min-height:calc(100vh - 66px);background:linear-gradient(120deg,#061a3a,#09295a 55%,#114da4);color:#fff;position:relative;overflow:hidden}
.home:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;right:-170px;top:-90px;background:radial-gradient(circle,#7793ff,#4058cf 42%,transparent 70%);opacity:.8}
.home-inner{max-width:1080px;min-height:calc(100vh - 66px);margin:auto;padding:48px 28px;position:relative;z-index:1}
.home-top{display:flex;justify-content:space-between;gap:25px;align-items:center}
.home h1{font-size:37px;line-height:1.12;margin:0 0 10px}.home .lead{font-size:17px;margin:0 0 8px}.home .desc{max-width:560px;color:#c8d8eb;font-size:13px;line-height:1.55}
.home-card{margin-top:30px;max-width:650px;background:#ffffff12;border:1px solid #ffffff28;border-radius:15px;padding:18px;backdrop-filter:blur(4px)}
.home-card h3{margin:0 0 8px;font-size:14px}.home-card p{font-size:11px;color:#dbe6f5}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}
.role{min-height:92px;border:0;border-radius:11px;color:#fff;text-align:left;padding:16px;box-shadow:0 9px 20px #0004}
.role small{display:block;font-size:10px;font-weight:600;margin-bottom:8px}.role b{font-size:19px}.role.worker{background:linear-gradient(135deg,#0878f9,#155be0)}.role.customer{background:linear-gradient(135deg,#743bd5,#8a49e8)}
.mini-flow{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.mini-flow span{background:#fff;color:#18375f;border-radius:7px;padding:7px 9px;font-size:9px;font-weight:700}
.flow-arrow{color:#8fc0ff;font-weight:900}
.dashboard-shell{max-width:1050px;margin:auto}
.dash-banner{background:linear-gradient(90deg,#0878f9,#155be0);color:#fff;border-radius:13px;padding:18px;margin-bottom:15px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.dash-banner.purple{background:linear-gradient(90deg,#743bd5,#8a49e8)}
.dash-banner h2{margin:0;font-size:20px}.dash-banner p{margin:5px 0 0;font-size:11px;opacity:.9}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.dash-card{padding:15px}.dash-card h3{margin:0 0 8px;font-size:14px}
.action-list{display:grid;gap:8px}.action{border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px;display:flex;align-items:center;gap:10px;text-align:left}
.action:hover{border-color:#83b8ff;background:#f8fbff}.action .circle{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#e8f2ff;color:var(--blue);font-weight:800}.action.p .circle{background:#f0e8ff;color:var(--purple)}.action strong{display:block;font-size:11px}.action small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;border:1px solid var(--line);border-radius:9px;text-align:center}.stat b{display:block;font-size:20px}.stat small{font-size:9px;color:var(--muted)}
.fields{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.field{min-height:105px;background:#fff;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;color:#16345f;font-weight:700;font-size:11px;box-shadow:0 2px 8px #173e6a0b}
.field:hover,.field.selected{border:2px solid #4c9dff;background:#f8fbff}.ico{font-size:28px}
.form{max-width:500px;margin:15px auto;padding:21px}.form h2{font-size:19px;margin:0 0 4px}.form>p{font-size:11px;color:var(--muted);margin:0 0 16px}
.row{display:grid;gap:5px;margin-bottom:11px}.row label{font-size:11px;font-weight:700}.row input,.row select,.row textarea{width:100%;border:1px solid #d7e2ee;border-radius:7px;padding:10px;background:#fff;outline:none}.row textarea{height:90px;resize:vertical}
.photo-box{display:flex;align-items:center;gap:12px;margin-bottom:13px;padding:10px;border:1px dashed #b9cde4;border-radius:9px}.photo-preview{width:55px;height:55px;border-radius:50%;background:#e9f2ff;display:grid;place-items:center;color:#1665c1;font-size:20px;overflow:hidden}.photo-preview img{width:100%;height:100%;object-fit:cover}
.success{max-width:430px;margin:50px auto;padding:28px;text-align:center}.check{width:54px;height:54px;border-radius:50%;background:#19c878;color:#fff;display:grid;place-items:center;margin:auto;font-size:27px}
.success h2{font-size:18px}.success p{font-size:11px;color:var(--muted)}.notice{background:#fff6d8;border:1px solid #efd98b;border-radius:8px;padding:12px;font-size:11px;text-align:left;margin:15px 0}
.price{background:linear-gradient(135deg,#0878f9,#155be0);color:#fff;padding:17px;border-radius:9px;text-align:center}.price small{font-size:11px}.amount{font-size:24px;font-weight:800;margin:7px}
.worker-list{max-width:760px;margin:auto}.worker-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px}
.avatar{width:45px;height:45px;border-radius:50%;background:linear-gradient(145deg,#263c5f,#091d3c);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1}.info strong{font-size:12px;display:block}.info small{font-size:10px;color:var(--muted);display:block;margin-top:3px}.worker-row .btn{padding:8px 12px;font-size:10px}.own-worker{border:2px solid var(--blue);background:#f8fbff}.you-badge{display:inline-block;background:var(--green);color:#fff;border-radius:4px;padding:2px 5px;font-size:8px;margin-left:5px;vertical-align:middle}

.chat-shell{max-width:680px;margin:15px auto;padding:0;overflow:hidden}.chat-head{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line);background:#fff}.chat-head .avatar{width:44px;height:44px}.chat-head strong{display:block;font-size:13px}.chat-head small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.chat-status{margin-left:auto;color:#15bd6d;font-size:10px}.chat-messages{height:420px;overflow:auto;padding:14px;background:#f4f7fb;display:flex;flex-direction:column;gap:8px}.chat-empty{text-align:center;color:var(--muted);font-size:11px;margin:auto}.chat-bubble{max-width:78%;padding:9px 11px;border-radius:13px;font-size:11px;line-height:1.4}.chat-bubble.mine{align-self:flex-end;background:#743bd5;color:#fff;border-bottom-right-radius:4px}.chat-bubble.theirs{align-self:flex-start;background:#fff;color:#233a5c;border:1px solid var(--line);border-bottom-left-radius:4px}.chat-bubble small{display:block;font-size:8px;opacity:.7;margin-top:4px}.chat-form{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--line)}.chat-form input{flex:1;margin:0;padding:11px;border:1px solid var(--line);border-radius:9px;outline:none}.chat-form .btn{width:auto;margin:0}
.profile{max-width:680px;margin:15px auto;padding:18px}.profiletop{display:flex;align-items:center;gap:14px}.profiletop .avatar{width:70px;height:70px}.profile hr{border:0;border-top:1px solid #e2e9f1;margin:18px 0}.profile h3{font-size:13px}.profile p,.profile li{font-size:11px;line-height:1.6}.checks{padding-left:0;list-style:none}.checks li:before{content:"✓";color:#15bd6d;font-weight:900;margin-right:8px}
.login-wrap{min-height:calc(100vh - 66px);display:grid;place-items:center;background:linear-gradient(135deg,#eef5ff,#f6f1ff)}.login{width:min(420px,92vw);padding:24px}.login h2{font-size:19px;margin:0}.login p{font-size:11px;color:var(--muted)}
.about,.contact{min-height:calc(100vh - 66px);padding:70px 20px}.about{background:#061a3a;color:#fff;text-align:center}.about .big{font-size:55px;font-weight:900}.about p{max-width:600px;margin:15px auto;line-height:1.6;color:#c5d3e7}.contact{background:#f4f8fc}.contact .card{max-width:600px;margin:auto;padding:25px}
.footer{background:#061a3a;color:#fff;text-align:center;padding:28px 18px}.footer-logo{font-size:24px;font-weight:800}.features{max-width:650px;margin:17px auto;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #ffffff22;border-bottom:1px solid #ffffff22;padding:15px 0}.features span{font-size:21px;border-right:1px solid #ffffff22}.features span:last-child{border-right:0}.features small{display:block;font-size:9px;line-height:1.35;margin-top:5px;color:#d4ddeb}
@media(max-width:700px){
 .header{height:62px;padding:0 14px}.nav{display:none;position:absolute;top:62px;left:0;right:0;background:#061a3a;padding:8px 14px;flex-direction:column;gap:2px;align-items:stretch}.nav.open{display:flex}.nav button{padding:12px;text-align:left}.menu{display:block}
 .home-inner{padding:38px 17px}.home h1{font-size:29px}.home-top{display:block}.roles{grid-template-columns:1fr}.role{min-height:80px}.home-card{margin-top:20px}
 .dash-grid{grid-template-columns:1fr}.fields{grid-template-columns:repeat(2,1fr);gap:8px}.field{min-height:96px;font-size:10px}.stats{grid-template-columns:repeat(3,1fr)}
 .worker-row{align-items:flex-start}.worker-row .btn{margin-left:auto}.footer .features{grid-template-columns:repeat(2,1fr);gap:10px}.features span{border-bottom:1px solid #ffffff22;padding-bottom:10px}.features span:nth-child(2){border-right:0}.features span:nth-child(3),.features span:nth-child(4){border-bottom:0}
}
</style>

<header class="header">
<button class="brand" onclick="go('home')"><span class="ain"><b class="a">A</b><b class="i">I</b><b class="n">N</b></span> is here<span class="tag">All I Need</span><span class="tooltip">All I Need</span></button>
<nav class="nav" id="nav"><button onclick="go('home')">Home</button><button onclick="go('about')">About</button><button onclick="go('contact')">Contact</button><button class="loginBtn" onclick="go('login')">Login</button></nav>
<button class="menu" onclick="document.getElementById('nav').classList.toggle('open')">☰</button>
</header>
<div id="app"></div>
<footer class="footer">
<div class="footer-logo"><span class="ain"><b class="a">A</b><b class="i">I</b><b class="n">N</b></span> is here</div>
<p>Connecting Workers and Customers, Making Life Easier!</p>
<div class="features"><span>🔒<small>Secure<br>Authentication</small></span><span>♙<small>Trusted<br>Workers</small></span><span>⚡<small>Fast & Easy<br>Access</small></span><span>♡<small>Support<br>Always</small></span></div>
<small>© 2026 AIN is here. All rights reserved.</small>
</footer>
<script>
const app=document.getElementById('app');
const fields=[['Computer scientists','💻'],['Gamer','🎮'],['Blogger','📝'],['Sound Engineer','🎧'],['Video Editor','▶️'],['Software Engineer','</>'],['Graphic Designer','🎨'],['Software Developer','</>'],['Others','•••']];
const workers=[['Kwame Beats','2 years experience','Professional sound engineer...','4.8 (12)'],['Abena Audio','3 years experience','Mixing & mastering specialist...','4.7 (8)'],['Kofi Soundz','5 years experience','Audio production & editing...','4.9 (15)'],['Yaw Mix','1 year experience','Sound editing and mixing...','4.6 (7)']];
function hideNav(){document.getElementById('nav').classList.remove('open')}
function set(html){app.innerHTML=html;window.scrollTo(0,0)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safe(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function initials(name){return (name||'Worker').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function getSavedWorker(){try{return JSON.parse(localStorage.getItem('ainWorkerProfile')||'null')}catch(e){return null}}
function getSavedCustomer(){try{return JSON.parse(localStorage.getItem('ainCustomer')||'null')}catch(e){return null}}
function fileAsDataURL(file){
 return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
}
async function uploadToBackblaze(file){
 if(!file)return '';
 const endpoint=String(window.BACKBLAZE_UPLOAD_ENDPOINT||'').trim();
 if(endpoint){
   const body=new FormData();body.append('file',file);
   const response=await fetch(endpoint,{method:'POST',body});
   if(!response.ok)throw new Error('Backblaze upload failed ('+response.status+').');
   const result=await response.json();
   if(!result.url)throw new Error('Upload endpoint did not return a file URL.');
   return result.url;
 }
 return await fileAsDataURL(file);
}
async function saveWorkerProfile(field){
 const form=document.querySelector('#workerProfileForm'); if(!form)return;
 const d=new FormData(form),file=form.querySelector('input[name=photo]')?.files?.[0];
 let photo='';
 try{photo=await uploadToBackblaze(file)}catch(e){alert('Profile picture upload failed: '+e.message);return null;}
 const worker={name:d.get('name'),email:String(d.get('email')||'').trim().toLowerCase(),password:String(d.get('password')||''),field,experience:d.get('experience'),description:d.get('description'),photo,subscribed:false,createdAt:new Date().toISOString()};
 localStorage.setItem('ainWorkerProfile',JSON.stringify(worker)); return worker;
}
function saveCustomer(field,name,email,phone,password){
 const c={name,field,email,phone,password:String(password||''),subscribed:false,createdAt:new Date().toISOString()};
 localStorage.setItem('ainCustomer',JSON.stringify(c)); return c;
}
function home(){
 hideNav();set(`<section class="home"><div class="home-inner">
 <div class="home-top"><div>
  <h1>AIN is here</h1><p class="lead">All I Need — Connecting Workers and Customers</p>
  <p class="desc">Choose your account type to get started. Workers create profiles and become available to customers. Customers choose the field they need and connect with available workers.</p>
  <div class="home-card"><h3>Start here</h3><p>Sign up or login as a Worker or Customer.</p>
   <div class="roles">
    <button class="role worker" onclick="fieldsPage('worker')"><small>👷 SIGN UP OR LOGIN AS</small><b>Worker</b></button>
    <button class="role customer" onclick="fieldsPage('customer')"><small>👤 SIGN UP OR LOGIN AS</small><b>Customer</b></button>
   </div>
   <div class="mini-flow"><span>1. Account type</span><i class="flow-arrow">→</i><span>2. Sign up / Login</span><i class="flow-arrow">→</i><span>3. Profile</span><i class="flow-arrow">→</i><span>4. Dashboard</span></div>
  </div>
 </div></div>
</div></section>`)
}
function fieldsPage(role){
 set(`<section class="page"><button class="back" onclick="home()">← Back</button>
 <div class="title"><span class="badge ${role==='worker'?'blue':'purple'}">${role==='worker'?'WORKER':'CUSTOMER'}</span>
 <h2>${role==='worker'?'Which field do you work in?':'Which field do you need help in?'}</h2>
 <p>${role==='worker'?'Select your field / skills.':'Choose the type of worker you need.'}</p></div>${grid(role)}</section>`)
}
function grid(role){
 return `<div class="fields">${fields.map(f=>`<button class="field" onclick="${role==='worker'?`workerForm('${safe(f[0])}')`:`customerForm('${safe(f[0])}')`}"><span class="ico">${f[1]}</span>${escapeHtml(f[0])}</button>`).join('')}</div>`
}
function workerForm(field){
 set(`<section class="page"><button class="back" onclick="fieldsPage('worker')">← Back</button>
 <div class="form card"><span class="badge blue">STEP 1 OF 3</span><h2>Create Your Worker Profile</h2><p>Your profile will be saved under <b>${escapeHtml(field)}</b>.</p>
 <form id="workerProfileForm" onsubmit="event.preventDefault();createWorkerProfile('${safe(field)}')">
 <div class="photo-box"><div class="photo-preview" id="photoPreview">👤</div><div><label style="font-size:11px;font-weight:700">Profile picture</label><input type="file" name="photo" accept="image/*" onchange="previewPhoto(event)" style="display:block;margin-top:5px;font-size:10px"></div></div>
 <div class="row"><label>Name</label><input name="name" required placeholder="Enter your full name"></div>
 <div class="row"><label>Email</label><input name="email" type="email" required autocomplete="email" placeholder="Enter your email"></div>
 <div class="row"><label>Password</label><input name="password" type="password" required minlength="6" autocomplete="new-password" placeholder="Create a password (minimum 6 characters)"></div>
 <div class="row"><label>Field / Work</label><select disabled><option>${escapeHtml(field)}</option></select></div>
 <div class="row"><label>Experience</label><input name="experience" required placeholder="e.g. 2 years"></div>
 <div class="row"><label>Description</label><textarea name="description" required placeholder="Tell customers about your work..."></textarea></div>
 <button class="btn full">Create Profile</button></form>
 <p style="font-size:10px;color:#6d7f99;margin-top:8px">Your email and password will be used to return to your worker dashboard when you log in.</p>
 <p style="text-align:center;margin-top:12px">Already have a worker account? <button type="button" class="back" onclick="login('worker')">Login</button></p></div></section>`)
}
async function createWorkerProfile(field){const w=await saveWorkerProfile(field);if(w)workerSuccess(field)}
function previewPhoto(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('photoPreview').innerHTML=`<img src="${r.result}" alt="Profile">`;};r.readAsDataURL(f)}
function workerSuccess(field){
 set(`<section class="page"><div class="success card"><div class="check">✓</div><span class="badge green">PROFILE CREATED</span><h2>Profile Created Successfully!</h2><p>You are now registered as a ${escapeHtml(field)} worker.</p>
 <div class="notice">🔐 <b>Next step:</b> pay the worker subscription of GHS 80.00 before your profile becomes available to customers.</div>
 <div class="price"><small>Worker Subscription</small><div class="amount">GHS 80.00</div><button class="btn white" onclick="pay('Worker')">Continue to Payment</button></div></div></section>`)
}
function customerForm(field){
 set(`<section class="page"><button class="back" onclick="fieldsPage('customer')">← Back</button>
 <div class="form card"><span class="badge purple">CUSTOMER ACCOUNT</span><h2>Create Your Customer Account</h2><p>Choose <b>${escapeHtml(field)}</b> as the field you need.</p>
 <form onsubmit="event.preventDefault();customerPay('${safe(field)}',this)">
 <div class="row"><label>Name</label><input name="name" required placeholder="Enter your full name"></div>
 <div class="row"><label>Email</label><input name="email" type="email" required placeholder="Enter your email"></div>
 <div class="row"><label>Phone Number</label><input name="phone" required placeholder="Enter your phone number"></div>
 <div class="row"><label>Password</label><input name="password" type="password" required placeholder="Create a password"></div>
 <button class="btn purple full">Create Account</button></form>
 <p style="text-align:center;margin-top:12px">Already have an account? <button class="back" onclick="login('customer')">Login</button></p></div></section>`)
}
function customerPay(field,form){
 const d=new FormData(form);saveCustomer(field,d.get('name'),d.get('email'),d.get('phone'),d.get('password'));
 set(`<section class="page"><div class="success card"><span class="badge purple">STEP 3 OF 3</span><h2>Subscribe to Continue</h2><p>Customers need an active subscription before contacting workers.</p>
 <div class="notice" style="background:#f1ebff;border-color:#d9c6ff">🟣 <b>Customer Subscription</b><ul><li>Access workers in your selected field</li><li>View worker profiles</li><li>Contact available workers</li></ul></div>
 <div class="price" style="background:linear-gradient(135deg,#743bd5,#8a49e8)"><small>Customer Subscription</small><div class="amount">GHS 40.00</div><button class="btn white" onclick="pay('Customer')">Continue to Payment</button></div></div></section>`)
}
async function addWorkerToPlatform(){

function restoreSession(){
 // Restore the last active SPA view from localStorage.
 // Do NOT depend on performance.navigation/reload detection: some mobile
 // browsers report refreshes differently, which previously sent chat back
 // to a dashboard or Home.
 const w=getSavedWorker(),c=getSavedCustomer();
 let a=null;
 try{a=JSON.parse(localStorage.getItem('ainActiveView')||'null')}catch(e){a=null}

 // Restore the login page itself after refresh.
 if(a?.type==='login' && (a.role==='customer' || a.role==='worker')){
   login(a.role,!!a.showSignup);
   return;
 }

 // A saved chat always has priority over the role dashboard.
 if(a?.type==='chat'){
   if(a.viewer==='customer' && c?.subscribed){
     openChat(a.workerId,a.workerName,a.field,'customer',a.customerId);
     return;
   }
   if(a.viewer==='worker' && w?.subscribed){
     openChat(a.workerId,a.workerName,a.field,'worker',a.customerId);
     return;
   }
 }

 // Restore the exact profile that was open.
 if(a?.type==='profile'){
   // The user could only have reached this profile after the relevant
   // account was active, so restore the profile even if an old prototype
   // record has a stale/missing subscribed flag.
   if(a.viewer==='customer' && c){
     profile(a.name,a.field,false,'customer');
     return;
   }
   if(a.viewer==='worker' && w){
     profile(a.name,a.field,!!a.isOwn,'worker');
     return;
   }
 }

 // Restore a Backblaze worker profile opened by a customer.
 if(a?.type==='BackblazeWorkerProfile' && a.workerId){
   if(c){
     BackblazeWorkerProfile(a.workerId,'customer');
     return;
   }
 }

 // Restore a locally stored worker profile opened by a customer.
 // This must be checked before the customer Workers platform so refresh
 // returns to the exact profile that was visible.
 if(a?.type==='localWorkerProfile' && c){
   const wLocal=getSavedWorker();
   if(wLocal?.subscribed){
     localWorkerProfileForCustomer();
     return;
   }
 }

 // Restore the worker Messages page itself.
 if(a?.type==='workerMessages'){
   if(w?.subscribed){
     workerMessages();
     return;
   }
 }

 // Restore the exact worker/customer platform.
 if(a?.type==='platform'){
   if(a.role==='customer' && c?.subscribed){
     customerPlatform(a.field);
     return;
   }
   if(a.role==='worker' && w?.subscribed){
     workerPlatform(a.field);
     return;
   }
 }

 // Restore the correct role dashboard.
 if(a?.type==='dashboard'){
   if(a.role==='customer' && c?.subscribed){
     customerDashboard();
     return;
   }
   if(a.role==='worker' && w?.subscribed){
     workerDashboard();
     return;
   }
 }

 // No saved active view/account: this is a normal fresh visit.
 home();
}
restoreSession();
</script>
</body>
</html>
